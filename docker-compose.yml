version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlanticsource_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlanticsource
      POSTGRES_PASSWORD: atlanticsource_secret
      POSTGRES_DB: atlanticsource_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlanticsource -d atlanticsource_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
